<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Good evening, <span id="greeting-name">Gia Phước</span> 👋</div>
        <div class="topbar__sub">Let's improve your SAT score today.</div>
      </div>
      <div class="topbar__meta">
        <span class="pill pill--streak">🔥 <span id="streak-count"></span></span>
        <span class="pill pill--xp">⚡ <span id="xp-count"></span></span>
      </div>
    </div>

    <section class="grid dash-grid">
      <!-- Score card -->
      <div class="card score-card">
        <div class="card__head">
          <span class="card__eyebrow" style="color:var(--on-navy-dim)">SAT Score</span>
          <a class="card__link" href="progress.html" style="color:var(--indigo-400)">View progress</a>
        </div>
        <div class="score-card__body" id="score-card-body"></div>
        <div class="score-target" id="score-target"></div>
      </div>

      <!-- Today's goal card -->
      <div class="card">
        <div class="card__head">
          <span class="card__title">Today's Goal</span>
        </div>
        <div class="goal-progress">
          <div class="goal-ring" id="goal-ring"></div>
          <div class="goal-progress__text" id="goal-progress-text"></div>
        </div>
        <div class="goal-list" id="goal-list"></div>
      </div>
    </section>

    <section class="grid dash-grid--secondary">
      <!-- Weak areas -->
      <div class="card">
        <div class="card__head">
          <span class="card__title">Weak Areas</span>
        </div>
        <div class="weak-list" id="weak-list"></div>
        <a href="practice.html?focus=weak" class="btn btn--primary btn--block" style="margin-top:18px;">
          Practice Weak Areas
        </a>
      </div>

      <!-- Recent mistakes -->
      <div class="card">
        <div class="card__head">
          <span class="card__title">Recent Mistakes</span>
          <a class="card__link" href="error-log.html">View all
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </a>
        </div>
        <div class="mistake-list" id="mistake-list"></div>
      </div>
    </section>

    <!-- Main CTA row -->
    <section class="cta-row">
      <a class="cta cta--primary" href="practice.html">
        <div class="cta__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-6-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
        </div>
        <div>
          <div class="cta__title">Start Practice</div>
          <div class="cta__sub">Jump into targeted questions</div>
        </div>
        <svg class="cta__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a class="cta cta--warn" href="error-log.html">
        <div class="cta__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg>
        </div>
        <div>
          <div class="cta__title">Review Mistakes</div>
          <div class="cta__sub">4 items need review</div>
        </div>
        <svg class="cta__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </section>

  </main>
</div>

<script src="js/app.js"></script>
<script src="js/data/dashboardData.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
