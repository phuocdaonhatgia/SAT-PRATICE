<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Practice Question — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/practice.css" />
</head>
<body>

<div class="qshell">

  <header class="qheader">
    <div class="qheader__left">
      <button class="qheader__exit" id="exit-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Exit
      </button>
      <span class="qheader__progress-text" id="qheader-progress-text"></span>
      <div class="qheader__bar-track"><div class="qheader__bar-fill" id="qheader-bar-fill"></div></div>
    </div>
    <div class="qtimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span id="qtimer-value">00:00</span>
    </div>
  </header>

  <main class="qbody" id="qbody">

    <div class="qmeta-row" id="qmeta-row"></div>

    <div class="qpassage__toolbar" id="qpassage-toolbar" style="display:none;">
      <span class="qpassage__hint-text">Select text in the passage to highlight it</span>
      <button class="link-btn" id="clear-highlights-btn" style="display:none;">Clear highlights</button>
    </div>
    <div class="qpassage" id="qpassage"></div>

    <div class="qprompt" id="qprompt"></div>

    <div class="qchoices" id="qchoices"></div>

    <div class="qactions">
      <button class="btn btn--primary" id="submit-btn">Submit Answer</button>
      <button class="btn btn--secondary" id="hint-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.6.6 1 1.3 1 2.5h6c0-1.2.4-1.9 1-2.5A6 6 0 0 0 12 2Z"/></svg>
        Hint
      </button>
      <button class="chip" id="review-chip"></button>
      <span class="qactions__spacer"></span>
      <button class="btn btn--ghost" id="explain-btn">Explain</button>
    </div>

    <div id="hint-panel-mount"></div>
    <div id="result-panel-mount"></div>

  </main>

  <div class="highlight-popup" id="highlight-popup">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 12 8l7 7-3 3-7-7Z"/><path d="m6 20 2-2"/><path d="m3 21 3-3-1-4 5 1 3 3"/></svg>
    Highlight
  </div>

  <footer class="qfooter" id="qfooter">
    <button class="btn btn--secondary" id="prev-btn">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Previous
    </button>
    <div class="qfooter__right">
      <button class="btn btn--primary" id="next-btn">
        Next
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <button class="btn btn--primary" id="finish-btn" style="display:none;">Finish Session</button>
    </div>
  </footer>

</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data/questionsData.js"></script>
<script src="js/questionEngine.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/errorLog.js"></script>
<script src="js/question.js"></script>
</body>
</html>
