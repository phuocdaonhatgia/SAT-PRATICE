<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vocabulary — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/practice.css" />
<link rel="stylesheet" href="css/vocabulary.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Vocabulary</div>
        <div class="topbar__sub">Learn, review, and quiz yourself on high-frequency SAT words.</div>
      </div>
      <button class="btn btn--primary" id="generate-level-btn">Generate 10 words based on my level</button>
    </div>

    <div class="vocab-stats" id="vocab-stats"></div>

    <div class="vocab-tabs">
      <button class="vocab-tab is-active" data-tab="daily">Daily Words</button>
      <button class="vocab-tab" data-tab="flashcards">Flashcards</button>
      <button class="vocab-tab" data-tab="quiz">Quiz</button>
      <button class="vocab-tab" data-tab="browse">SAT Words</button>
      <button class="vocab-tab" data-tab="missed">Words I Missed</button>
    </div>

    <!-- Daily Words -->
    <div class="vocab-pane is-active" id="pane-daily">
      <div class="word-grid" id="daily-grid"></div>
    </div>

    <!-- Flashcards -->
    <div class="vocab-pane" id="pane-flashcards"></div>

    <!-- Quiz -->
    <div class="vocab-pane" id="pane-quiz"></div>

    <!-- SAT Words browser -->
    <div class="vocab-pane" id="pane-browse">
      <div class="word-toolbar">
        <input class="text-input" id="browse-search" placeholder="Search words..." style="max-width:260px;" />
        <div class="chip-row" id="browse-diff-chips">
          <button class="chip is-selected" data-diff="all">All</button>
          <button class="chip" data-diff="easy">Easy</button>
          <button class="chip" data-diff="medium">Medium</button>
          <button class="chip" data-diff="hard">Hard</button>
        </div>
      </div>
      <div class="word-grid" id="browse-grid"></div>
    </div>

    <!-- Words I Missed -->
    <div class="vocab-pane" id="pane-missed">
      <div class="word-toolbar">
        <span style="font-size:13px; color:var(--text-600);">Words you've marked "Review again"</span>
        <button class="btn btn--secondary" id="missed-cta">Study These as Flashcards</button>
      </div>
      <div class="word-grid" id="missed-grid"></div>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data/vocabData.js"></script>
<script src="js/vocabService.js"></script>
<script src="js/vocabulary.js"></script>
</body>
</html>
