<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/practice.css" />
<link rel="stylesheet" href="css/progress.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Progress</div>
        <div class="topbar__sub">Your score trend, accuracy, and skill breakdown over time.</div>
      </div>
    </div>

    <div class="progress-grid" style="margin-bottom:18px;">
      <div class="card">
        <div class="card__head"><span class="card__title">Score Progress</span></div>
        <div class="linechart-wrap">
          <div id="score-linechart"></div>
          <div class="linechart-labels" id="score-linechart-labels"></div>
        </div>
      </div>

      <div class="card">
        <div class="card__head"><span class="card__title">Accuracy</span></div>
        <div class="accuracy-row" id="accuracy-row"></div>
      </div>
    </div>

    <div class="progress-grid">
      <div class="card">
        <div class="card__head"><span class="card__title">Skill Breakdown</span></div>
        <div class="skill-breakdown-list" id="skill-breakdown-list"></div>
      </div>

      <div class="card">
        <div class="card__head"><span class="card__title">Error Trends</span></div>
        <div class="errortrend-chart" id="errortrend-chart"></div>
      </div>
    </div>

  </main>
</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data/progressData.js"></script>
<script src="js/errorLog.js"></script>
<script src="js/progress.js"></script>
</body>
</html>
