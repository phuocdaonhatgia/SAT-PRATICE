<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Error Log — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/error-log.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Error Log</div>
        <div class="topbar__sub">Every mistake, why it happened, and how to fix it.</div>
      </div>
    </div>

    <div class="errlog-toolbar">
      <div class="errlog-stats" id="errlog-stats"></div>
      <div class="chip-row" id="filter-chips"></div>
    </div>

    <div class="errlog-table-wrap" id="errlog-table-wrap">
      <table class="errlog-table">
        <thead>
          <tr>
            <th>Question</th>
            <th>Subject</th>
            <th>Topic</th>
            <th>Error Type</th>
            <th>Reflection</th>
            <th>Correct Strategy</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="errlog-rows"></tbody>
      </table>
    </div>

    <div class="card empty-state" id="errlog-empty" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11 13.5 15.5 9"/><rect x="3" y="4" width="18" height="17" rx="2"/></svg>
      <div class="empty-state__title">No mistakes logged yet</div>
      <div class="empty-state__sub">Once you answer a question incorrectly during practice, it will show up here automatically.</div>
      <a href="practice.html" class="btn btn--primary" style="margin-top:16px;">Start Practicing</a>
    </div>

  </main>
</div>

<div class="modal-backdrop errlog-modal" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data/questionsData.js"></script>
<script src="js/questionEngine.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/errorLog.js"></script>
<script src="js/errorAnalyzer.js"></script>
<script src="js/errorLogPage.js"></script>
</body>
</html>
