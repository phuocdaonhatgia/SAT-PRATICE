<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/practice.css" />
<link rel="stylesheet" href="css/progress.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Progress</div>
        <div class="topbar__sub">Your accuracy and skill breakdown, based on the practice you've actually done.</div>
      </div>
    </div>

    <div class="progress-grid" style="margin-bottom:18px;">
      <div class="card">
        <div class="card__head"><span class="card__title">Accuracy</span></div>
        <div class="accuracy-row" id="accuracy-row"></div>
      </div>

      <div class="card">
        <div class="card__head"><span class="card__title">Skill Breakdown</span></div>
        <div class="skill-breakdown-list" id="skill-breakdown-list"></div>
      </div>
    </div>

    <!-- Learning Sprint (Design Thinking, spec mục 19) -->
    <section class="card" style="margin-top:18px;">
      <div class="card__head">
        <span class="card__title">Your SAT Learning Sprint</span>
      </div>
      <div class="sprint-tabs" id="sprint-tabs"></div>
      <div id="sprint-pane-mount"></div>
    </section>

  </main>
</div>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data/questionsData.js"></script>
<script src="js/questionEngine.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/errorLog.js"></script>
<script src="js/gamificationService.js"></script>
<script src="js/compositionHelpers.js"></script>
<script src="js/progress.js"></script>
<script src="js/learningSprint.js"></script>
</body>
</html>
