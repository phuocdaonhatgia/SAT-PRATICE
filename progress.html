<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress — SAT Practice</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/upgrade.css" />
<link rel="stylesheet" href="css/practice.css" />
<link rel="stylesheet" href="css/progress.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-mount"></aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="topbar__greeting">Progress</div>
        <div class="topbar__sub">Your accuracy and skill breakdown, based on the practice you've actually done.</div>
      </div>
    </div>

    <div class="progress-grid" style="margin-bottom:18px;">
      <div class="card">
        <div class="card__head"><span class="card__title">Accuracy</span></div>
        <div class="accuracy-row" id="accuracy-row"></div>
      </div>

      <div class="card">
        <div class="card__head"><span class="card__title">Skill Breakdown</span></div>
        <div class="skill-breakdown-list" id="skill-breakdown-list"></div>
      </div>
    </div>

    <!-- Advanced Analytics (Plus) -->
    <section class="card" style="margin-bottom:18px;">
      <div class="card__head">
        <span class="card__title">Advanced Analytics</span>
      </div>
      <div id="advanced-analytics-mount"></div>
    </section>

    <!-- Báo cáo tiến độ chi tiết (Plus) -->
    <section class="card" style="margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div>
        <div class="card__title" style="margin-bottom:4px;">Báo cáo tiến độ chi tiết</div>
        <div style="font-size:12.5px; color:var(--text-600);">Tổng hợp toàn bộ số liệu, in hoặc lưu PDF.</div>
      </div>
      <button class="btn btn--primary" id="detailed-report-btn">Xuất báo cáo</button>
    </section>

    <!-- Learning Sprint (Design Thinking, spec mục 19) -->
    <section class="card" style="margin-top:18px;">
      <div class="card__head">
        <span class="card__title">Your SAT Learning Sprint</span>
      </div>
      <div class="sprint-tabs" id="sprint-tabs"></div>
      <div id="sprint-pane-mount"></div>
    </section>

  </main>
</div>

<!-- Firebase: phải đứng trước mọi thứ -->
<script src="js/firebase-config.js"></script>
<script type="module" src="js/firebase-init.js"></script>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/authService.js"></script>
<script src="js/cloudSync.js"></script>
<script src="js/authGuard.js"></script>
<script src="js/planService.js"></script>
<script src="js/upgradeModal.js"></script>

<script src="js/data/questionsData.js"></script>
<script src="js/questionEngine.js"></script>
<script src="js/sessionManager.js"></script>
<script src="js/errorLog.js"></script>
<script src="js/gamificationService.js"></script>
<script src="js/compositionHelpers.js"></script>
<script src="js/progressService.js"></script>
<script src="js/progress.js"></script>
<script src="js/learningSprint.js"></script>
</body>
</html>
